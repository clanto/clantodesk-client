[package]
name = "clanto-win"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR Apache-2.0"
description = "ClantoDesk: Windows native checks (Authenticode signatures, device posture) without PowerShell"

[lib]
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
] }
