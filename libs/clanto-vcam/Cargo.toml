[package]
name = "clanto-vcam"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR Apache-2.0"
description = "ClantoDesk virtual camera: shared frame buffer and Windows 11 Media Foundation control"

[lib]
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Variant",
] }
