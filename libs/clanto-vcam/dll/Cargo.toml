[package]
name = "clanto-vcam-dll"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR Apache-2.0"
description = "ClantoDesk virtual camera media source, loaded by the Windows Frame Server"

[lib]
name = "clanto_vcam"
crate-type = ["cdylib"]

[dependencies]
clanto-vcam = { path = ".." }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-core = "0.61"
