name: macOS only (DMG Intel + ARM)

# Costruisce solo i due DMG macOS, senza far ripartire tutta la nightly.
on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag della release su cui pubblicare"
        type: string
        default: "nightly"

jobs:
  run-macos:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      targets: macos
