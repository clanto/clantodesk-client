name: Android client only (Play Store)

# Variante CLIENT: solo accesso remoto, non puo' essere controllata.
# E' quella da pubblicare sul Play Store: il manifest non dichiara il servizio
# di accessibilita', la cattura schermo, l'overlay ne' il microfono, quindi non
# c'e' nessun permesso sensibile da giustificare e non e' utilizzabile per una
# truffa al finto supporto tecnico.
#
# Tag distinto da quello della variante host: i due applicationId sono diversi
# e gli artefatti non devono finire sulla stessa release.
on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag della release su cui pubblicare"
        type: string
        default: "nightly-client"

jobs:
  run-android-client:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      targets: android
      conn-type: outgoing
