name: Full Flutter CI (windows)

# Firma con i certificati di produzione e pubblica su release: solo avvio manuale.
# NON aggiungere `push` ne' `pull_request`: eseguirebbero codice non validato con
# i certificati Azure/Apple/Android in env.
on:
  workflow_dispatch:

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
