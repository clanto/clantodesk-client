name: Windows only (EXE + MSI)

# Costruisce solo Windows (installer, portable e MSI), senza far ripartire tutta la nightly.
on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag della release su cui pubblicare"
        type: string
        default: "nightly"

jobs:
  run-windows:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
      targets: windows
