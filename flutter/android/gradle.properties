org.gradle.jvmargs=-Xmx1024M
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=false
# Le .so a 64 bit sono allineate a 16 KB (NDK r28c), ma AGP 7.3.1 scrive un
# BundleConfig senza direttiva di allineamento: Play impacchetta le librerie non
# compresse a 4 KB nello zip e l'app non parte sui dispositivi a pagine 16 KB.
# Comprimendole si torna a extractNativeLibs=true, dove conta solo il p_align
# dell'ELF. Rimuovere quando AGP sale a 8.5.1 o oltre.
android.bundle.enableUncompressedNativeLibs=false
