import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper

plugins {
    id "com.google.protobuf" version "0.9.4"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }
    
    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }
    
    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")
    
    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }
    
    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.20.1'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

// Ruolo della build. Unica fonte di verita' condivisa con il core: e' la stessa
// CONN_TYPE che src/clanto/config.rs mette in HARD_SETTINGS. Cosi' manifest,
// applicationId e comportamento del core non possono divergere.
//   outgoing -> solo client, variante pubblicata sul Play Store
//   incoming -> solo host, variante per i monitor interattivi
//   non impostata -> build completa, comportamento storico
def clantoRole = (System.getenv("CONN_TYPE") ?: "").trim()
if (!["", "outgoing", "incoming"].contains(clantoRole)) {
    throw new GradleException(
        "CONN_TYPE non valido: '${clantoRole}'. Ammessi: outgoing, incoming, oppure non impostata.")
}
def clantoIsHost = clantoRole == "incoming"
def clantoIsClient = clantoRole == "outgoing"

android {
    compileSdkVersion 34
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/hbb_common/protos'
        main.proto.includes += "message.proto"

        // La variante client usa un manifest ridotto: niente AccessibilityService,
        // MediaProjection, overlay, microfono ne' avvio al boot. Vedi CLANTO.md.
        if (clantoIsClient) {
            main.manifest.srcFile 'src/main/AndroidManifest-client.xml'
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        // La variante host ha un package proprio: senza questo Play
        // aggiornerebbe le installazioni manuali sostituendole con la variante
        // client, che non puo' essere assistita.
        applicationId clantoIsHost ? "it.clanto.clantodesk.host" : "it.clanto.clantodesk"
        // Il nome visibile e' un segnaposto del manifest, non config::APP_NAME:
        // quello alimenta i percorsi di configurazione e non va toccato.
        manifestPlaceholders = [
            appLabel  : clantoIsHost ? "ClantoDesk Host" : "ClantoDesk",
            inputLabel: clantoIsHost ? "ClantoDesk Host Input" : "ClantoDesk Input",
        ]
        minSdkVersion 22
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
      release {
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
        storePassword keystoreProperties['storePassword']
      }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("1.9.10") } }
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
